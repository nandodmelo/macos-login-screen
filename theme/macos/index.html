<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
  <!-- Configuração do usuário (gerada pelo comando macos-login); se faltar, o tema usa padrões -->
  <script src="/var/lib/macos-login/config.js"></script>
  <!-- Só entra em ação fora do LightDM (pré-visualização no navegador) -->
  <script src="mock.js"></script>
</head>
<body>
  <div id="bg" class="bg"></div>
  <div id="dim" class="dim"></div>

  <main id="screen">
    <header id="clock">
      <div id="date"></div>
      <div id="time"></div>
    </header>

    <section id="login">
      <button id="avatar" class="avatar" type="button" tabindex="-1">
        <img id="avatar-img" alt="">
        <span id="avatar-initials"></span>
      </button>
      <div id="username"></div>

      <form id="pass-form" autocomplete="off">
        <div class="field">
          <input id="password" type="password" placeholder="Digite a senha" spellcheck="false" autofocus>
          <span id="caps" class="caps" title="Caps Lock ativado">
            <svg viewBox="0 0 24 24"><path d="M12 3 3 12h5v5h8v-5h5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 20h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          <button id="submit" class="submit" type="submit" aria-label="Entrar">
            <svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>
      <div id="message" class="message"></div>
    </section>

    <footer id="power">
      <button class="power-btn" data-action="suspend" type="button" tabindex="-1">
        <span class="power-icon"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
        <span class="power-label">Repouso</span>
      </button>
      <button class="power-btn" data-action="restart" type="button" tabindex="-1">
        <span class="power-icon"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="power-label">Reiniciar</span>
      </button>
      <button class="power-btn" data-action="shutdown" type="button" tabindex="-1">
        <span class="power-icon"><svg viewBox="0 0 24 24"><path d="M12 3v8M7.05 6.05a7 7 0 1 0 9.9 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        <span class="power-label">Desligar</span>
      </button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
