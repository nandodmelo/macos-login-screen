# Configuração do nody-greeter — instalado pelo macos-login-screen/install.sh
branding:
    # Pasta das imagens de fundo (e do config.js do tema). Pertence ao seu usuário.
    background_images_dir: /var/lib/macos-login
    logo_image: ""
    user_image: ""
greeter:
    debug_mode: False
    detect_theme_errors: True
    screensaver_timeout: 300
    secure_mode: True
    theme: macos
    icon_theme:
    time_language: pt-BR
layouts:
    - br
features:
    battery: False
    backlight:
        enabled: False
        value: 10
        steps: 0
